<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>钉探 - 智能小车远程控制</title>
  <link rel="stylesheet" href="styles.css?v=20261006-video-network" />
  <link rel="stylesheet" href="topbar.css" />
  <link rel="stylesheet" href="connection-settings.css?v=20261006-video-network" />
</head>
<body>
  <div class="app">
    <!-- 顶部导航栏（与导航控制页共用 topbar.css） -->
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">钉</span><strong>钉探<span>机器人控制台</span></strong></a>
      <nav aria-label="控制页面"><a href="index.html" aria-current="page">手动控制</a><a href="navigation.html">导航控制</a></nav>
      <span class="topbar-spacer"></span>
      <button class="button subtle" id="settingsButton" type="button">连接设置</button>
    </header>

    <!-- 主体内容区 -->
    <main class="main">
      <!-- 左侧面板：用户信息 + 小车状态 + 摄像头 + 控制 -->
      <aside class="panel panel-left">
        <!-- 用户信息 -->
        <section class="card user-card">
          <div class="user-avatar">
            <svg viewBox="0 0 64 64" width="44" height="44">
              <circle cx="32" cy="32" r="32" fill="#4f8cff"/>
              <circle cx="32" cy="24" r="11" fill="#fff"/>
              <ellipse cx="32" cy="52" rx="18" ry="14" fill="#fff"/>
            </svg>
          </div>
          <div class="user-info">
            <div class="user-name" id="userName">操作员 Alpha</div>
            <div class="user-role" id="userRole">高级控制员</div>
          </div>
        </section>

        <!-- 小车状态 -->
        <section class="card status-card">
          <h3 class="card-title">小车状态</h3>
          <div class="status-row">
            <span class="status-dot status-dot--green" id="statusDot"></span>
            <span class="status-text" id="statusText">手动控制未启用</span>
          </div>
          <p id="taskSummary" role="status">任务服务未连接</p>
        </section>

        <!-- 摄像头图像 -->
        <section class="card camera-card">
          <h3 class="card-title">摄像头实时画面 <select id="videoTopic" aria-label="画面来源"><option value="/detected_image">YOLO 画面</option><option value="/camera/color/image_raw">原始画面</option></select> <button id="retryVideoButton" type="button">重连</button></h3>
          <p class="video-detail" id="videoEndpoint">视频服务：等待连接配置</p>
          <p class="video-detail" id="videoHint" role="status">检查视频地址和小车服务启动状态。</p>
          <div class="camera-feed" id="cameraFeed">
            <img 
                id="cameraImage"
                
                alt="YOLO检测视频"
            />
            <div class="camera-overlay">
              <span class="camera-rec" id="videoStatus">正在连接视频</span>
              <span class="camera-time" id="cameraTime">实时性未确认</span>
            </div>
          </div>
        </section>

        <!-- 控制窗口（移至左侧） -->
        <section class="card control-card">
          <h3 class="card-title">命令控制窗口</h3>
          <div class="control-form">
            <div class="form-params" id="formParams"><button id="connectTaskButton" type="button">连接任务状态</button> <button id="enableManualButton" type="button">启用独立手动</button> <button id="requestManualButton" type="button" disabled>申请接管</button> <button id="releaseManualButton" type="button" disabled>结束接管</button><p id="controlFeedback" role="status">独立手动需关闭导航；任务协调当前仅本地模拟。</p></div>
          </div>
          <div class="direction-pad">
            <button class="dpad-btn" data-cmd="left_forward">↖ 左前</button>
            <button class="dpad-btn" data-cmd="forward">▲ 前进</button>
            <button class="dpad-btn" data-cmd="right_forward">↗ 右前</button>
            <button class="dpad-btn" data-cmd="left">◀ 左转</button>
            <button class="dpad-btn" data-cmd="stop">⛔ 停止</button>
            <button class="dpad-btn" data-cmd="right">右转 ▶</button>
            <button class="dpad-btn" data-cmd="left_backward">↙ 左后</button>
            <button class="dpad-btn" data-cmd="backward">▼ 后退</button>
            <button class="dpad-btn" data-cmd="right_backward">↘ 右后</button>
          </div>
        </section>
      </aside>

      <!-- 右侧面板：关键识别事件 + 消息记录 -->
      <section class="panel panel-right">
        <!-- 关键识别事件（移至右侧，并上移） -->
        <section class="card events-card">
          <h3 class="card-title">关键识别事件</h3>
          <p id="detectionStatus" role="status">等待检测事件接口</p>
          <ul class="events-list" id="eventsList">
            <!-- 动态由后端推送填充 -->
          </ul>
        </section>

        <!-- 消息列表 -->
        <section class="card messages-card">
          <h3 class="card-title">消息记录</h3>
          <div class="messages-list" id="messagesList">
            <!-- 动态由系统/后端推送填充 -->
          </div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="app.js?v=20261006-video-topic"></script>
</body>
</html>
